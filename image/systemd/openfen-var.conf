# Openfen persistent service directories
# Recreated by systemd-tmpfiles when needed.

# GNOME AccountsService
d /var/lib/AccountsService 0775 root root -
d /var/lib/AccountsService/icons 0775 root root -
d /var/lib/AccountsService/users 0700 root root -

# Bluetooth
d /var/lib/bluetooth 0700 root root -
d /var/lib/bluetooth/mesh 0755 root root -

# Colour management
d /var/lib/color 0755 root root -
d /var/lib/color/icc 0755 root root -

# Location services
d /var/lib/geoclue 0755 geoclue geoclue -

# USB device pairing state
d /var/lib/lockdown 2775 usbmuxd usbmuxd -

# Flatpak
d /var/lib/flatpak 0755 root root -

# Plymouth and desktop services
d /var/lib/plymouth 0755 root root -
d /var/lib/tuned 0755 root root -
d /var/log/tuned 0755 root root -
d /var/log/speech-dispatcher 0700 root root -
d /var/spool/plymouth 0755 root root -
